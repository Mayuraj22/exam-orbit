<div class="auth-card">
  <h1>Sign in to your exams</h1>
  <p class="sub">Use the username and passcode your exam admin sent you.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field class="full-width">
      <mat-label>Username</mat-label>
      <input
        matInput
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        required
      />
      <mat-error>Enter your username.</mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Passcode</mat-label>
      <input
        matInput
        [type]="showPasscode() ? 'text' : 'password'"
        formControlName="passcode"
        autocomplete="current-password"
        autocapitalize="characters"
        spellcheck="false"
        required
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="showPasscode.set(!showPasscode())"
        [attr.aria-label]="showPasscode() ? 'Hide passcode' : 'Show passcode'"
      >
        <mat-icon>{{ showPasscode() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Enter your passcode.</mat-error>
    </mat-form-field>

    @if (formError(); as message) {
      <p class="form-error" role="alert">
        <mat-icon inline aria-hidden="true">error_outline</mat-icon> {{ message }}
      </p>
    }

    <button mat-flat-button type="submit" class="full-width submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18" />
      }
      Continue
    </button>
  </form>
</div>
